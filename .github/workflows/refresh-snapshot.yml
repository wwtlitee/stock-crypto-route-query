name: refresh-security-snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "21 2 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade openpyxl

      - name: Regenerate snapshot
        run: python scripts/generate_security_snapshot.py

      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- assets/market-data.js; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/market-data.js
          git commit -m "Refresh security snapshot"
          git push
